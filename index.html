<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <title>Built with gstack</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: {
                fontFamily: { sans: ['Inter','sans-serif'], mono: ['JetBrains Mono','monospace'] },
                colors: { base: '#0a0a0f', card: '#111118' }
            }}
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; overflow-x: hidden; }
        body { background: #0a0a0f; overflow-x: hidden; }
        .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
        .tag { transition: all 0.15s ease; }
        .tag:hover { background: rgba(255,255,255,0.1); }
        .tag.active { background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.5); color: rgba(96,165,250,1); font-weight: 500; }
        .search-input:focus { box-shadow: 0 0 0 2px rgba(59,130,246,0.3); }
        .fade-in { animation: fadeIn 0.3s ease forwards; opacity: 0; }
        @keyframes fadeIn { to { opacity: 1; } }
        /* Skeleton loading */
        .skeleton { background: linear-gradient(90deg, #111118 25%, #1a1a24 50%, #111118 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 0.75rem; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        /* Category badge colors */
        .cat-skill-pack { background: rgba(59,130,246,0.12); color: rgba(96,165,250,0.9); border-color: rgba(59,130,246,0.25); }
        .cat-extension { background: rgba(168,85,247,0.12); color: rgba(192,132,252,0.9); border-color: rgba(168,85,247,0.25); }
        .cat-tool { background: rgba(34,197,94,0.12); color: rgba(74,222,128,0.9); border-color: rgba(34,197,94,0.25); }
        .cat-guide { background: rgba(234,179,8,0.12); color: rgba(250,204,21,0.9); border-color: rgba(234,179,8,0.25); }
        .cat-template { background: rgba(244,63,94,0.12); color: rgba(251,113,133,0.9); border-color: rgba(244,63,94,0.25); }
        /* Tooltip */
        .card-desc { position: relative; cursor: default; }
        .card-desc:hover .tooltip { display: block; }
        .tooltip { display: none; position: absolute; left: 0; top: 100%; z-index: 30; margin-top: 4px;
            background: #1a1a24; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            padding: 10px 12px; font-size: 12px; line-height: 1.5; color: rgba(255,255,255,0.7);
            width: max(100%, 280px); max-width: 360px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); pointer-events: none; }
    </style>
</head>
<body class="bg-base text-white min-h-screen">

    <!-- Header -->
    <header class="border-b border-white/5 sticky top-0 bg-base/80 backdrop-blur-xl z-50">
        <div class="max-w-6xl mx-auto px-4 md:px-8 py-4 md:py-5 flex items-center justify-between gap-3" style="padding-top: max(1rem, env(safe-area-inset-top));">
            <a href="/" class="min-w-0 no-underline group">
                <h1 class="text-base md:text-lg font-semibold tracking-tight text-white/90 group-hover:text-white transition-colors">Built with <span class="text-blue-400">gstack</span></h1>
                <p class="text-white/40 text-[11px] md:text-xs mt-0.5 hidden sm:block">Projects powered by Garry Tan's Claude Code skills</p>
            </a>
            <a href="https://github.com/garrytan/gstack" target="_blank" rel="noopener"
               class="text-white/50 hover:text-white/90 text-xs border border-white/15 px-3 py-1.5 rounded-lg transition-colors shrink-0">
                View gstack
            </a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 md:px-8 py-8">

        <!-- Featured project of the day -->
        <section id="featured" class="mb-12">
            <p class="text-white/40 text-xs font-mono tracking-wider uppercase mb-4">Project of the day</p>
            <div id="featuredCard" class="bg-gradient-to-br from-blue-500/10 via-card to-card border border-blue-500/20 rounded-xl p-6 md:p-8">
                <!-- Filled by JS -->
            </div>
        </section>

        <!-- Search + filters -->
        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <div class="flex-1 relative">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-white/30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <input id="searchInput" type="text" placeholder="Search projects..."
                       class="search-input w-full bg-white/5 border border-white/10 rounded-lg pl-10 pr-4 py-2.5 text-base md:text-sm text-white placeholder:text-white/30 outline-none transition-all">
            </div>
            <div class="flex gap-2 flex-nowrap overflow-x-auto shrink-0 -mx-1 px-1" id="sortButtons" role="group" aria-label="Sort order">
                <button onclick="setSort('stars')" class="tag active text-xs px-3 py-1.5 border border-white/10 rounded-lg text-white/60 whitespace-nowrap" data-sort="stars" aria-pressed="true">Most stars</button>
                <button onclick="setSort('recent')" class="tag text-xs px-3 py-1.5 border border-white/10 rounded-lg text-white/60 whitespace-nowrap" data-sort="recent" aria-pressed="false">Recently updated</button>
                <button onclick="setSort('name')" class="tag text-xs px-3 py-1.5 border border-white/10 rounded-lg text-white/60 whitespace-nowrap" data-sort="name" aria-pressed="false">A-Z</button>
            </div>
        </div>

        <!-- Category filters -->
        <div class="flex gap-2 flex-wrap mb-6" id="categoryFilters" role="group" aria-label="Category filter">
            <button onclick="setCategory('all')" class="tag active text-xs px-3 py-1.5 border border-white/10 rounded-lg text-white/60" data-cat="all" aria-pressed="true">All</button>
            <button onclick="setCategory('skill-pack')" class="tag text-xs px-3 py-1.5 border border-white/10 rounded-lg text-white/60" data-cat="skill-pack" aria-pressed="false">Skill Packs</button>
            <button onclick="setCategory('extension')" class="tag text-xs px-3 py-1.5 border border-white/10 rounded-lg text-white/60" data-cat="extension" aria-pressed="false">Extensions</button>
            <button onclick="setCategory('tool')" class="tag text-xs px-3 py-1.5 border border-white/10 rounded-lg text-white/60" data-cat="tool" aria-pressed="false">Tools</button>
            <button onclick="setCategory('guide')" class="tag text-xs px-3 py-1.5 border border-white/10 rounded-lg text-white/60" data-cat="guide" aria-pressed="false">Guides</button>
            <button onclick="setCategory('template')" class="tag text-xs px-3 py-1.5 border border-white/10 rounded-lg text-white/60" data-cat="template" aria-pressed="false">Templates</button>
        </div>

        <!-- Results count -->
        <p id="resultCount" class="text-white/40 text-xs font-mono mb-4"></p>

        <!-- Project grid -->
        <div id="projectGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Skeleton placeholders shown on initial load -->
            <div class="skeleton h-40"></div>
            <div class="skeleton h-40"></div>
            <div class="skeleton h-40"></div>
            <div class="skeleton h-40 hidden md:block"></div>
            <div class="skeleton h-40 hidden md:block"></div>
            <div class="skeleton h-40 hidden lg:block"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-white/5 mt-16 py-8 text-center" style="padding-bottom: max(2rem, env(safe-area-inset-bottom));">
        <p class="text-white/30 text-xs">Data snapshot from GitHub, April 2026.</p>
    </footer>

    <script>
    (function() {
        'use strict';

        const projects = [
            { name: "gstack-game", fullName: "fagemx/gstack-game", desc: "Complete game production workflow for Claude Code. 27 skills from concept to shipped build. Design review, prototype planning, game feel diagnosis, playability assessment, QA with fix loop, and release.", stars: 23, lang: "Go Template", updated: "2026-04-05", cat: "skill-pack" },
            { name: "claude-jarvis", fullName: "UpayanGhosh/claude-jarvis", desc: "Universal intent router for Claude Code. Picks the best skill from GSD, Superpowers, and gstack automatically.", stars: 4, lang: "JavaScript", updated: "2026-04-09", cat: "extension" },
            { name: "claude-code-skills", fullName: "terisuke/claude-code-skills", desc: "Production-ready Claude Code configuration: 27 skills, 37 hooks, 5 rules. Includes Anthropic best practices and gstack integration.", stars: 3, lang: "Shell", updated: "2026-04-03", cat: "skill-pack" },
            { name: "super-aidlc", fullName: "warren830/super-aidlc", desc: "Structured AI development skill combining AIDLC-workflows + Superpowers + gstack. Supports Kiro and Claude Code.", stars: 2, lang: "TypeScript", updated: "2026-04-09", cat: "extension" },
            { name: "forge", fullName: "KKenny0/forge", desc: "Agentic skills framework. Combines Superpowers and gstack: brainstorming, design review, TDD, automated QA with real browser testing, cross-model code review, one-command shipping.", stars: 2, lang: "", updated: "2026-04-05", cat: "skill-pack" },
            { name: "claude-setup-guide", fullName: "michaeltruch/claude-setup-guide", desc: "Complete Claude Code setup guide: Skills, Plugins, MCP servers, gstack, Superpowers, and claude-mem.", stars: 1, lang: "", updated: "2026-04-08", cat: "guide" },
            { name: "skill-kit", fullName: "RealAumi/skill-kit", desc: "Forkable template for building Claude Code skill frameworks. Design patterns extracted from gstack.", stars: 1, lang: "Shell", updated: "2026-03-26", cat: "template" },
            { name: "claude-stack-plugin", fullName: "bdarbaz/claude-stack-plugin", desc: "Unified Claude Code plugin: 27 skills, 12 agents, 6 hooks, 8 rules. Merges GSD + Superpowers + gstack + Compound into one namespace.", stars: 1, lang: "Shell", updated: "2026-03-29", cat: "skill-pack" },
            { name: "gstack-chat", fullName: "Ray0907/gstack-chat", desc: "Bot for gstack discussion skills, powered by Claude OAuth.", stars: 0, lang: "TypeScript", updated: "2026-03-21", cat: "tool" },
            { name: "gstack-antigravity", fullName: "krnbwj/gstack-antigravity", desc: "astack: Opinionated workflow skills for Antigravity, formerly GStack for Claude Code.", stars: 0, lang: "TypeScript", updated: "2026-03-17", cat: "extension" },
            { name: "gspowers", fullName: "fshaan/gspowers", desc: "AI dev workflow orchestrator. Claude Code skill coordinating gstack + superpowers.", stars: 0, lang: "Shell", updated: "2026-04-02", cat: "extension" },
            { name: "gstack-guide", fullName: "dotanminh/gstack-guide", desc: "Vietnamese documentation for Garry Tan's workflow skills for Claude Code.", stars: 0, lang: "HTML", updated: "2026-03-15", cat: "guide" },
            { name: "flutter-project-template", fullName: "hungHoni/flutter-project-template", desc: "Flutter project template with Claude Code config, minimalist UI design system, and gstack skills.", stars: 0, lang: "TypeScript", updated: "2026-03-25", cat: "template" },
            { name: "itd5-agentic-stack", fullName: "5hay196/itd5-agentic-stack", desc: "ITD5 Agentic Stack. Paperclip company OS + gstack Claude Code skills for zero-human business orchestration.", stars: 0, lang: "Shell", updated: "2026-03-31", cat: "tool" },
            { name: "skill-fusion", fullName: "Bryanh9111/skill-fusion", desc: "Hard routing rules for running gstack + superpowers together. Decision layer wraps execution layer, no overlapping skills.", stars: 0, lang: "", updated: "2026-04-02", cat: "extension" },
            { name: "gstack-lite", fullName: "effinrich/gstack-lite", desc: "Five Claude Code workflow skills as plain Markdown. No binary deps. Adapted from garrytan/gstack.", stars: 0, lang: "", updated: "2026-03-21", cat: "extension" },
            { name: "franc-system-template", fullName: "francky180/franc-system-template", desc: "AI Software Factory: 102+ Claude Code skills, BRAIN Obsidian vault, one-click install. Superpowers + gstack + Marketing Suite.", stars: 0, lang: "Shell", updated: "2026-04-08", cat: "skill-pack" },
            { name: "my-ai-stack", fullName: "Hyuk/my-ai-stack", desc: "AI-powered development stack: Claude Code, oh-my-claudecode, MCP servers, 32 specialized agents, 30+ gstack skills.", stars: 0, lang: "", updated: "2026-04-03", cat: "guide" },
            { name: "gstack-wsl-setup", fullName: "meoroo76/gstack-wsl-setup", desc: "gstack WSL installation and macOS compatibility patch for Windows Subsystem for Linux.", stars: 0, lang: "", updated: "2026-03-30", cat: "tool" },
            { name: "hyperstack", fullName: "jkcau6698/hyperstack", desc: "Hybrid Claude Code skills: best of gstack + oh-my-claudecode. 8 sprint-structured skills for planning, review, debugging, shipping.", stars: 0, lang: "JavaScript", updated: "2026-03-29", cat: "skill-pack" },
            { name: "factory", fullName: "killvxk/factory", desc: "10 engineering skills + 4 review agents + 1 pipeline. Self-contained Claude Code plugin distilled from compound-engineering, agent-skills, and gstack.", stars: 0, lang: "", updated: "2026-04-08", cat: "skill-pack" },
            { name: "gstack-showcase", fullName: "micovi/gstack-showcase", desc: "Visual guide to gstack: diagrams, use cases, and cheat sheets for the Claude Code skill suite.", stars: 0, lang: "", updated: "2026-03-25", cat: "guide" },
            { name: "gstack-sandbox", fullName: "B42Labs/gstack-sandbox", desc: "Containerized development environment for running Claude Code with gstack skills on any repository. Pre-configured with Go and Kubernetes toolchain.", stars: 0, lang: "Dockerfile", updated: "2026-03-25", cat: "tool" },
            { name: "ag-kit", fullName: "trinhhaox/ag-kit", desc: "Turn Claude Code and Gemini CLI into a complete engineering team. 21 agents, 54 skills, 16 workflows. Integrates superpowers + gstack.", stars: 0, lang: "Python", updated: "2026-03-28", cat: "skill-pack" },
            { name: "claude-retro", fullName: "Ktulue/claude-retro", desc: "Standalone Claude Code skill for structured post-session retrospectives, extracted from gstack's /retro skill.", stars: 0, lang: "", updated: "2026-03-25", cat: "extension" },
            { name: "startup-os", fullName: "acesley180604/startup-os", desc: "49-skill startup operating system for Claude Code. 28 startup lifecycle workflows + 21 gstack dev tools. Covers Discovery through Ops.", stars: 0, lang: "TypeScript", updated: "2026-03-21", cat: "skill-pack" },
            { name: "prism-playbook", fullName: "duyentb95/prism-playbook", desc: "PRISM: Open-source AI Team Playbook for Claude Code. Conventions, templates, and pre-built skills for structured planning and parallel execution.", stars: 0, lang: "Shell", updated: "2026-04-08", cat: "template" },
            { name: "claude-office-hours", fullName: "Ktulue/claude-office-hours", desc: "Standalone Claude Code skill for design-first brainstorming, extracted from gstack's /office-hours. Three modes: startup, research, builder.", stars: 0, lang: "", updated: "2026-03-25", cat: "extension" },
            { name: "smstack-ai", fullName: "priyanshuj-ai/smstack-ai", desc: "AI-powered personal media agency. Claude Code skills for social media: brand discovery, topic research, post generation, fact-checking, content calendar.", stars: 0, lang: "Shell", updated: "2026-03-20", cat: "tool" },
            { name: "gstack (fork)", fullName: "rmarino550/gstack", desc: "gstack skills for Claude Code (community fork).", stars: 0, lang: "TypeScript", updated: "2026-03-20", cat: "extension" },
        ];

        // ---- Utilities ----
        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function catClass(cat) {
            const map = { 'skill-pack': 'cat-skill-pack', 'extension': 'cat-extension', 'tool': 'cat-tool', 'guide': 'cat-guide', 'template': 'cat-template' };
            return map[cat] || 'cat-extension';
        }

        function catLabel(cat) {
            const map = { 'skill-pack': 'Skill Pack', 'extension': 'Extension', 'tool': 'Tool', 'guide': 'Guide', 'template': 'Template' };
            return map[cat] || cat;
        }

        // ---- State ----
        let currentSort = 'stars';
        let currentCategory = 'all';
        let searchQuery = '';
        let initialLoad = true;

        // ---- Featured project of the day ----
        function getFeaturedProject() {
            const now = new Date();
            const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
            const starred = projects.filter(p => p.stars > 0);
            const others = projects.filter(p => p.stars === 0 && p.desc.length > 80);
            const pool = [...starred, ...starred, ...starred, ...others];
            return pool[dayOfYear % pool.length];
        }

        function renderFeatured() {
            const p = getFeaturedProject();
            document.getElementById('featuredCard').innerHTML = `
                <div class="flex flex-col md:flex-row md:items-start gap-4">
                    <div class="flex-1">
                        <a href="https://github.com/${esc(p.fullName)}" target="_blank" rel="noopener"
                           class="text-xl font-semibold text-white hover:text-blue-300 transition-colors no-underline">
                            ${esc(p.fullName)}
                        </a>
                        <p class="text-white/60 text-sm mt-2 leading-relaxed">${esc(p.desc)}</p>
                        <div class="flex items-center gap-4 mt-4">
                            ${p.stars > 0 ? `<span class="text-yellow-400/80 text-xs flex items-center gap-1"><svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>${p.stars}</span>` : ''}
                            ${p.lang ? `<span class="text-white/50 text-xs">${esc(p.lang)}</span>` : ''}
                            <span class="text-xs px-2 py-0.5 rounded border ${catClass(p.cat)}">${catLabel(p.cat)}</span>
                        </div>
                    </div>
                    <a href="https://github.com/${esc(p.fullName)}" target="_blank" rel="noopener"
                       class="shrink-0 px-4 py-2 bg-blue-500/20 border border-blue-500/30 rounded-lg text-blue-300 text-xs hover:bg-blue-500/30 transition-colors no-underline">
                        View on GitHub
                    </a>
                </div>
            `;
        }

        // ---- Render grid ----
        function getFilteredProjects() {
            let filtered = [...projects];
            if (currentCategory !== 'all') {
                filtered = filtered.filter(p => p.cat === currentCategory);
            }
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(p =>
                    p.name.toLowerCase().includes(q) ||
                    p.desc.toLowerCase().includes(q) ||
                    p.fullName.toLowerCase().includes(q) ||
                    (p.lang && p.lang.toLowerCase().includes(q))
                );
            }
            if (currentSort === 'stars') filtered.sort((a, b) => b.stars - a.stars);
            else if (currentSort === 'recent') filtered.sort((a, b) => b.updated.localeCompare(a.updated));
            else if (currentSort === 'name') filtered.sort((a, b) => a.name.localeCompare(b.name));
            return filtered;
        }

        function renderGrid() {
            const filtered = getFilteredProjects();
            const grid = document.getElementById('projectGrid');
            document.getElementById('resultCount').textContent = `${filtered.length} project${filtered.length !== 1 ? 's' : ''}`;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-20">
                        <svg class="w-12 h-12 mx-auto text-white/10 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        <p class="text-white/40 text-sm mb-1">No projects found</p>
                        <p class="text-white/25 text-xs">Try a different search term or clear the filters.</p>
                    </div>`;
                return;
            }

            // Cap animation delay at 300ms total
            const maxDelay = 300;
            const perCard = filtered.length > 1 ? Math.min(maxDelay / filtered.length, 20) : 0;

            grid.innerHTML = filtered.map((p, i) => `
                <a href="https://github.com/${esc(p.fullName)}" target="_blank" rel="noopener"
                   class="card-hover ${initialLoad ? 'fade-in' : ''} bg-card border border-white/5 rounded-xl p-5 no-underline block group"
                   style="${initialLoad ? 'animation-delay:' + Math.round(i * perCard) + 'ms;' : ''}">
                    <div class="flex items-start justify-between mb-2">
                        <h3 class="text-sm font-medium text-white/90 truncate flex-1 group-hover:text-blue-300 transition-colors">${esc(p.name)}</h3>
                        ${p.stars > 0 ? `<span class="text-yellow-400/70 text-xs flex items-center gap-1 shrink-0 ml-2"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>${p.stars}</span>` : ''}
                    </div>
                    <div class="card-desc">
                        <p class="text-white/50 text-xs leading-relaxed mb-3 line-clamp-3">${esc(p.desc)}</p>
                        ${p.desc.length > 120 ? `<div class="tooltip">${esc(p.desc)}</div>` : ''}
                    </div>
                    <div class="flex items-center gap-2.5">
                        ${p.lang ? `<span class="text-white/50 text-[10px] font-mono">${esc(p.lang)}</span>` : ''}
                        <span class="text-[10px] px-1.5 py-0.5 border rounded ${catClass(p.cat)}">${catLabel(p.cat)}</span>
                        <span class="text-white/35 text-[10px] ml-auto">${p.updated}</span>
                    </div>
                </a>
            `).join('');
        }

        // ---- Interactions ----
        window.setSort = function(sort) {
            currentSort = sort;
            document.querySelectorAll('#sortButtons .tag').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
            const el = document.querySelector(`#sortButtons [data-sort="${sort}"]`);
            el.classList.add('active'); el.setAttribute('aria-pressed', 'true');
            renderGrid();
        };

        window.setCategory = function(cat) {
            currentCategory = cat;
            document.querySelectorAll('#categoryFilters .tag').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
            const el = document.querySelector(`#categoryFilters [data-cat="${cat}"]`);
            el.classList.add('active'); el.setAttribute('aria-pressed', 'true');
            renderGrid();
        };

        let _searchTimer = null;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(_searchTimer);
            _searchTimer = setTimeout(() => { searchQuery = e.target.value; renderGrid(); }, 150);
        });

        // ---- Init (with skeleton delay for perceived loading) ----
        setTimeout(() => {
            renderFeatured();
            renderGrid();
            setTimeout(() => { initialLoad = false; }, 400);
        }, 100);
    })();
    </script>
