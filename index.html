        ];

        // ---- Utilities ----
        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function catClass(cat) {
            const map = { 'skill-pack': 'cat-skill-pack', 'extension': 'cat-extension', 'tool': 'cat-tool', 'guide': 'cat-guide', 'template': 'cat-template' };
            return map[cat] || 'cat-extension';
        }

        function catLabel(cat) {
            const map = { 'skill-pack': 'Skill Pack', 'extension': 'Extension', 'tool': 'Tool', 'guide': 'Guide', 'template': 'Template' };
            return map[cat] || cat;
        }

        // ---- State ----
        let currentSort = 'stars';
        let currentCategory = 'all';
        let searchQuery = '';
        let initialLoad = true;

        // ---- Featured project of the day ----
        function getFeaturedProject() {
            const now = new Date();
            const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
            const starred = projects.filter(p => p.stars > 0);
            const others = projects.filter(p => p.stars === 0 && p.desc.length > 80);
            const pool = [...starred, ...starred, ...starred, ...others];
            return pool[dayOfYear % pool.length];
        }

        function renderFeatured() {
            const p = getFeaturedProject();
            document.getElementById('featuredCard').innerHTML = `
                <div class="flex flex-col md:flex-row md:items-start gap-4">
                    <div class="flex-1">
                        <a href="https://github.com/${esc(p.fullName)}" target="_blank" rel="noopener"
                           class="text-xl font-semibold text-white hover:text-blue-300 transition-colors no-underline">
                            ${esc(p.fullName)}
                        </a>
                        <p class="text-white/60 text-sm mt-2 leading-relaxed">${esc(p.desc)}</p>
                        <div class="flex items-center gap-4 mt-4">
                            ${p.stars > 0 ? `<span class="text-yellow-400/80 text-xs flex items-center gap-1"><svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>${p.stars}</span>` : ''}
                            ${p.lang ? `<span class="text-white/50 text-xs">${esc(p.lang)}</span>` : ''}
                            <span class="text-xs px-2 py-0.5 rounded border ${catClass(p.cat)}">${catLabel(p.cat)}</span>
                        </div>
                    </div>
                    <a href="https://github.com/${esc(p.fullName)}" target="_blank" rel="noopener"
                       class="shrink-0 px-4 py-2 bg-blue-500/20 border border-blue-500/30 rounded-lg text-blue-300 text-xs hover:bg-blue-500/30 transition-colors no-underline">
                        View on GitHub
                    </a>
                </div>
            `;
        }

        // ---- Render grid ----
        function getFilteredProjects() {
            let filtered = [...projects];
            if (currentCategory !== 'all') {
                filtered = filtered.filter(p => p.cat === currentCategory);
            }
            if (searchQuery) {
                const words = searchQuery.toLowerCase().split(/[\s\-_]+/).filter(w => w.length > 0);
                filtered = filtered.filter(p => {
                    // Combine all searchable text into one string, replacing hyphens/underscores with spaces
                    const haystack = [p.name, p.desc, p.fullName, p.lang || '', p.cat]
                        .join(' ').toLowerCase().replace(/[-_]/g, ' ');
                    // Every word must appear somewhere
                    return words.every(w => haystack.includes(w));
                });
            }
            if (currentSort === 'stars') filtered.sort((a, b) => b.stars - a.stars);
            else if (currentSort === 'recent') filtered.sort((a, b) => b.updated.localeCompare(a.updated));
            else if (currentSort === 'name') filtered.sort((a, b) => a.name.localeCompare(b.name));
            return filtered;
        }

        function renderGrid() {
            const filtered = getFilteredProjects();
            const grid = document.getElementById('projectGrid');
            document.getElementById('resultCount').textContent = `${filtered.length} project${filtered.length !== 1 ? 's' : ''}`;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-20">
                        <svg class="w-12 h-12 mx-auto text-white/10 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        <p class="text-white/40 text-sm mb-1">No projects found</p>
                        <p class="text-white/25 text-xs">Try a different search term or clear the filters.</p>
                    </div>`;
                return;
            }

            // Cap animation delay at 300ms total
            const maxDelay = 300;
            const perCard = filtered.length > 1 ? Math.min(maxDelay / filtered.length, 20) : 0;

            grid.innerHTML = filtered.map((p, i) => `
                <a href="https://github.com/${esc(p.fullName)}" target="_blank" rel="noopener"
                   class="card-hover ${initialLoad ? 'fade-in' : ''} bg-card border border-white/5 rounded-xl p-5 no-underline block group"
                   style="${initialLoad ? 'animation-delay:' + Math.round(i * perCard) + 'ms;' : ''}">
                    <div class="flex items-start justify-between mb-2">
                        <h3 class="text-sm font-medium text-white/90 truncate flex-1 group-hover:text-blue-300 transition-colors">${esc(p.name)}</h3>
                        ${p.stars > 0 ? `<span class="text-yellow-400/70 text-xs flex items-center gap-1 shrink-0 ml-2"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>${p.stars}</span>` : ''}
                    </div>
                    <div class="card-desc">
                        <p class="text-white/50 text-xs leading-relaxed mb-3 line-clamp-3">${esc(p.desc)}</p>
                        ${p.desc.length > 120 ? `<div class="tooltip">${esc(p.desc)}</div>` : ''}
                    </div>
                    <div class="flex items-center gap-2.5">
                        ${p.lang ? `<span class="text-white/50 text-[10px] font-mono">${esc(p.lang)}</span>` : ''}
                        <span class="text-[10px] px-1.5 py-0.5 border rounded ${catClass(p.cat)}">${catLabel(p.cat)}</span>
                        <span class="text-white/35 text-[10px] ml-auto">${p.updated}</span>
                    </div>
                </a>
            `).join('');
        }

        // ---- Interactions ----
        window.setSort = function(sort) {
            currentSort = sort;
            document.querySelectorAll('#sortButtons .tag').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
            const el = document.querySelector(`#sortButtons [data-sort="${sort}"]`);
            el.classList.add('active'); el.setAttribute('aria-pressed', 'true');
            renderGrid();
        };

        window.setCategory = function(cat) {
            currentCategory = cat;
            document.querySelectorAll('#categoryFilters .tag').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
            const el = document.querySelector(`#categoryFilters [data-cat="${cat}"]`);
            el.classList.add('active'); el.setAttribute('aria-pressed', 'true');
            renderGrid();
        };

        let _searchTimer = null;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(_searchTimer);
            _searchTimer = setTimeout(() => { searchQuery = e.target.value; renderGrid(); }, 150);
        });

        // ---- Init (with skeleton delay for perceived loading) ----
        setTimeout(() => {
            renderFeatured();
            renderGrid();
            setTimeout(() => { initialLoad = false; }, 400);
        }, 100);
    })();
    </script>
